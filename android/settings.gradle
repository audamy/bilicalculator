pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        def propertiesFile = new File(rootDir.parentFile, '.flutter-plugins-dependencies')
        if (propertiesFile.exists()) {
            propertiesFile.withInputStream { stream -> properties.load(stream) }
        }
        
        def flutterSdkPath = properties.getProperty('flutter.sdk')
        if (!flutterSdkPath) {
            // Look in local.properties
            def localPropsFile = new File(rootDir, 'local.properties')
            if (localPropsFile.exists()) {
                properties.clear()
                localPropsFile.withInputStream { stream -> properties.load(stream) }
                flutterSdkPath = properties.getProperty('flutter.sdk')
            }
        }
        return flutterSdkPath
    }()

    if (flutterSdkPath != null) {
        includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")
    }

    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }
}

plugins {
    id "dev.flutter.flutter-gradle-plugin" version "1.0.0" apply false
}

include ":app"

def localPropertiesFile = new File(rootDir, "local.properties")
def properties = new Properties()

if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { stream -> properties.load(stream) }
}

def flutterSdkPath = properties.getProperty('flutter.sdk')
if (flutterSdkPath == null) {
    flutterSdkPath = System.getenv('FLUTTER_SDK') ?: System.getenv('HOME') + '/flutter'
}
